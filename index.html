<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Visual Novel: Hilman & RT (Mobile)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #1a202c; /* Latar gelap untuk desktop */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container menyerupai layar HP untuk desktop, full untuk mobile */
        .app-container {
            width: 100%;
            max-width: 430px; /* Ukuran standar iPhone Pro Max */
            height: 100vh;
            max-height: 932px;
            background: linear-gradient(150deg, #8ba8c8 0%, #3e5879 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Media query untuk memberi efek rounded di Desktop */
        @media (min-width: 640px) {
            .app-container {
                height: 90vh;
                border-radius: 2rem;
                border: 8px solid #2d3748;
            }
        }

        .char-base {
            position: absolute;
            bottom: 0;
            width: 55%; /* Agar muat bersebelahan di layar kecil */
            height: 75%;
            object-fit: contain;
            transition: all 0.4s cubic-bezier(0.25, 1.25, 0.3, 1); /* Efek membal sedikit */
            transform-origin: bottom center;
        }

        .char-rt { left: -5%; }
        .char-hilman { right: -5%; }

        .char-active {
            transform: scale(1.05) translateY(0);
            filter: brightness(1.1) drop-shadow(0 15px 15px rgba(0,0,0,0.4));
            z-index: 20;
            opacity: 1;
        }

        .char-inactive {
            transform: scale(0.9) translateY(20px);
            filter: brightness(0.5) blur(1.5px);
            z-index: 10;
            opacity: 0.6;
        }

        /* Animasi cursor kedap-kedip untuk typewriter */
        .cursor::after {
            content: '|';
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Area Panggung Karakter (Atas) -->
        <div class="flex-1 relative w-full h-full">
            <!-- Karakter RT -->
            <img id="char-rt" 
                 src="rt.png.png" 
                 alt="RT" 
                 class="char-base char-rt char-inactive">
            
            <!-- Karakter Hilman -->
            <img id="char-hilman" 
                 src="hilman.png.png" 
                 alt="Hilman" 
                 class="char-base char-hilman char-active">
        </div>

        <div id="dialogue-box" class="h-64 bg-white rounded-t-3xl shadow-[0_-10px_25px_rgba(0,0,0,0.2)] p-5 flex flex-col relative z-30 cursor-pointer transition-transform duration-300">
            
            <!-- Label Nama -->
            <div id="speaker-badge" class="absolute -top-5 left-6 text-white font-extrabold text-sm tracking-wider uppercase px-5 py-1.5 rounded-full shadow-md border-2 border-white transition-colors duration-300">
                Hilman
            </div>

            <!-- Teks Percakapan -->
            <div class="mt-4 flex-1">
                <p id="dialogue-text" class="text-gray-700 text-lg sm:text-xl font-semibold leading-relaxed">
                    ...
                </p>
            </div>

            <!-- Petunjuk Interaksi (Tombol Lanjut) -->
            <div class="mt-auto flex justify-end items-center text-sm font-bold text-gray-400 animate-pulse">
                <span>Ketuk layar untuk lanjut</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                </svg>
            </div>
        </div>
    </div>

    <script>
        // Data percakapan
        const story = [
            { name: 'RT', text: 'sebenarnya kita ini apa sih', color: 'bg-rose-500' },
            { name: 'Hilman', text: 'kita adalah dua orang yang saling nyaman', color: 'bg-blue-600' },
            { name: 'RT', text: 'lalu kenapa kita selalu banyak pertengkaran', color: 'bg-rose-500' },
            { name: 'Hilman', text: 'ya kita masih belum percaya satu sama lain, kita juga masih selalu mementingkan ego masing masing', color: 'bg-blue-600' },
            { name: 'RT', text: 'tapikan kita saling nyaman', color: 'bg-rose-500' },
            { name: 'Hilman', text: 'ya di situlah kita mau segimanapun berantemnya aku tetap butuh kamu', color: 'bg-blue-600' },
            { name: 'RT', text: 'dan aku juga butuh kamu', color: 'bg-rose-500' },
            { name: 'Hilman', text: 'yaa jadi aku mau kita selalu bisa mengerti, bahwa dasarnya kita memang selalu ingin berdekatan satu sama lain', color: 'bg-blue-600' },
            { name: 'RT', text: 'yaa aku juga mau selalu sama kamu', color: 'bg-rose-500' }
        ];

        let currentLine = 0;
        let isTyping = false;
        let typingInterval;

        // Referensi elemen DOM
        const domRT = document.getElementById('char-rt');
        const domHilman = document.getElementById('char-hilman');
        const domBadge = document.getElementById('speaker-badge');
        const domText = document.getElementById('dialogue-text');
        const dialogueBox = document.getElementById('dialogue-box');

        function renderScene() {
            if (currentLine >= story.length) {
                endStory();
                return;
            }

            const line = story[currentLine];

            // Update Label Nama
            domBadge.textContent = line.name;
            // Reset kelas warna sebelumnya, lalu tambahkan warna baru
            domBadge.className = `absolute -top-5 left-6 text-white font-extrabold text-sm tracking-wider uppercase px-5 py-1.5 rounded-full shadow-md border-2 border-white transition-colors duration-300 ${line.color}`;

            // Update Karakter (Siapa yang bicara)
            if (line.name === 'RT') {
                domRT.classList.replace('char-inactive', 'char-active');
                domHilman.classList.replace('char-active', 'char-inactive');
            } else {
                domHilman.classList.replace('char-inactive', 'char-active');
                domRT.classList.replace('char-active', 'char-inactive');
            }

            // Jalankan animasi ketik
            playTypewriter(line.text);
        }

        function playTypewriter(text) {
            clearInterval(typingInterval);
            isTyping = true;
            domText.innerHTML = '';
            domText.classList.add('cursor');
            
            let i = 0;
            typingInterval = setInterval(() => {
                if (i < text.length) {
                    domText.innerHTML += text.charAt(i);
                    i++;
                } else {
                    clearInterval(typingInterval);
                    isTyping = false;
                    domText.classList.remove('cursor');
                }
            }, 40); // Kecepatan ketik
        }

        function nextLine() {
            if (isTyping) {
                // Jika sedang ngetik, langsung selesaikan teksnya
                clearInterval(typingInterval);
                domText.innerHTML = story[currentLine].text;
                domText.classList.remove('cursor');
                isTyping = false;
            } else {
                // Jika selesai ngetik, lanjut ke baris berikutnya
                currentLine++;
                renderScene();
            }
        }

        function endStory() {
            domRT.classList.replace('char-active', 'char-inactive');
            domHilman.classList.replace('char-active', 'char-inactive');
            domBadge.style.display = 'none';
            
            domText.innerHTML = `<span class="text-indigo-600 font-bold block text-center text-2xl mt-4">Tamat</span>`;
            
            // Sembunyikan tulisan "Ketuk layar..."
            dialogueBox.querySelector('.animate-pulse').style.display = 'none';
        }

        // User bisa mengetuk seluruh area kotak dialog untuk lanjut (sangat nyaman di HP)
        dialogueBox.addEventListener('click', nextLine);
        // User juga bisa mengetuk karakter/layar atas untuk lanjut
        document.querySelector('.flex-1').addEventListener('click', nextLine);

        // Mulai aplikasi
        window.onload = () => {
            renderScene();
        };
    </script>
</body>
</html>
